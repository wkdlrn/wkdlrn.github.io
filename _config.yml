about_profile_image: 증명사진.jpg
about_content: |
  API 응답 지연, 기존 DB 검색의 기술적 한계, 팀 내 배포 업무 불균형 등 프로젝트 진행 과정에서 마주치는 문제를 구조적으로 분석하고,
  JPA N+1 해결, Elasticsearch 도입, AI Agent(Agentica) 기반 대화형 배포 자동화 등 근본적인 해결책을 직접 구현해온 백엔드 개발자 김재구입니다.

  응답속도 90% 단축, 검색 성능 120% 향상, API 성공률 18%p 개선 등 측정 가능한 성과로 결과를 검증하며,
  단순히 동작하는 코드를 넘어 팀 전체의 생산성을 높이는 개발 문화를 만들어가고 싶습니다.

content:
  - title: Projects
    layout: list
    content:
      - layout: left
        title: 책빵 프로젝트
        caption: 2024.12 ~ 2025.03 (4개월) · 5명
        links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/beyond-sw-camp/be12-3rd-5ven-bread_book
        quote: >
          응답속도 90% 단축 · 가용성 99.9% 달성 · 성능 최적화부터 무중단 배포·모니터링까지 직접 구축
        description: |
          도서 리뷰 플랫폼 백엔드를 개발하며 성능 최적화, 무중단 배포 인프라, 실시간 모니터링까지 직접 구축한 프로젝트입니다.

          **사용 기술:** Java, Spring Boot, JPA / Hibernate, Jenkins, Docker, Kubernetes, Prometheus, Grafana

          **① JPA N+1 문제 해결 (API 성능 최적화)**
          - 리뷰 목록 API 응답 속도 최대 20초 지연 문제를 SQL 로그 분석으로 식별
          - Fetch Join, @EntityGraph 적용으로 불필요한 쿼리 최소화
          - Pageable 개선으로 필요한 데이터만 효율적으로 조회
          - 평균 응답속도 1~2초로 단축 (90% 감소)

          **② 채팅방 조회 쿼리 성능 개선 및 DB 부하 최적화**
          - 채팅방 목록 조회 시 서브쿼리 기반 구조로 chatting_room·book·product 테이블 간 불필요한 연산 발생, DB 부하 증가 및 응답 속도 저하
          - Prometheus + Grafana 모니터링으로 해당 조회 시 DB 서버 CPU 사용량이 높게 나타남을 확인
          - chatting_room → book → product 순 다중 JOIN 구조로 개선해 조회 흐름 단순화, set profiling으로 실행 시간 비교 검증
          - 쿼리 실행 시간 약 1/3 단축, DB 서버 CPU 사용률 약 85% 감소

          **③ 무중단 배포 환경 구축 (Jenkins + Kubernetes + Blue-Green)**
          - GitHub Webhook으로 코드 푸시 시 Jenkins 자동 빌드·테스트·Docker 이미지 생성
          - Kubernetes 클러스터에 자동 배포 구성
          - Blue-Green Deployment 전략으로 신규 버전 배포 중에도 기존 서비스 무중단 운영
          - Jenkins Discord 플러그인으로 배포 결과 팀 채널 자동 공유
          - 서비스 가용성 99.9% 달성
          - 모니터링 스크립트 작성으로 장애 감지 체계 마련

      - layout: left
        title: 월정액인생 프로젝트
        caption: 2025.03 ~ 2025.05 (2개월) · 4명
        links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/beyond-sw-camp/be12-fin-Gongcha1-MonthlyLIfe-BE
        quote: >
          RPS 50 → 110 (120% 향상) · MapStruct 도입 · 퍼사드 패턴으로 구조 개선
        description: |
          정기구독 기반 주문 관리 시스템으로, 인프라 안정화·검색 성능 개선·구조 리팩토링한 프로젝트입니다.

          **사용 기술:** Java, Spring Boot, Elasticsearch, Logstash, Jenkins, Docker, Kubernetes, MariaDB

          **① MapStruct 도입을 통한 DTO 변환 구조 개선**
          - 팀원마다 Builder 패턴으로 DTO ↔ Entity 변환을 각자 구현, 로직 불일치·코드 중복 발생
          - DTO 기반 구조 특성상 변환 코드가 많이 발생, Builder 패턴은 매번 수동 필드 매핑이 필요해 휴먼 에러·유지보수 어려움 초래
          - MapStruct 도입 제안 — 어노테이션 기반 자동 생성으로 일관된 매핑 구조 확보, 팀원 설득 후 프로젝트 전체 변환 방식 통일
          - DTO-Entity 변환 코드 약 30% 감소, 코드 일관성·가독성 향상, 개발 속도 개선으로 WBS 일정 단축 효과

          **② 대용량 검색 시스템 개선 (상품 20,000건 이상)**
          - Elasticsearch 도입 및 커스텀 분석기 구성 (초성 검색, 영↔한 변환 검색)
          - Logstash + ConfigMap으로 MariaDB와 1분 주기 실시간 동기화
          - RPS 50 → 110 (120% 향상), 검색 정확도·속도 향상

          **③ 퍼사드 패턴을 통한 결제 시스템 구조 개선**
          - 결제·빌링키·구독·정산·이메일 등 6개 서비스를 PaymentFacade로 통합
          - 트랜잭션을 퍼사드 레벨에서 일관되게 관리
          - 컨트롤러 코드 약 70% 감소, 서비스 간 결합도 감소, 단위 테스트 용이

      - layout: left
        title: Pipely 프로젝트
        caption: 2025.06 ~ 2025.11 (5개월) · 3명
        links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/baepo-minjok/pipely
        quote: >
          오픈소스 개발자대회 우수작 · AI Agent(Agentica) 기반 대화형 CI/CD · API 성공률 70% → 88%
        description: |
          Agentica 기반으로 자연어 명령을 해석해 실제 배포를 수행하는 대화형 CI/CD 시스템입니다. 오픈소스 개발자대회 우수작으로 선정되었습니다.

          **사용 기술:** Agentica, OpenAI API, Jenkins, Swagger, Docker, Kubernetes

          **① 대화형 자동 배포 (Agentica 기반)**
          - "새 버전 배포해줘" 같은 자연어 명령을 Swagger와 연동된 실제 배포로 수행
          - Agentica 프롬프트 커스터마이징으로 AI 응답을 한국어 마크다운 표 형태로 출력, 사용자 경험(UX) 개선
          - Swagger 문서 최적화로 명령 인식률 향상
          - API 실행 성공률 70% → 88% (+18%p)

          **② 빌드 실패 로그 분석 자동화**
          - 빌드 실패 로그를 OpenAI ChatGPT에 전달, 출력 규칙 프롬프트로 일관된 분석
          - 문제 요약 → 원인 → 해결 방안 → 재발 방지 → 핵심 로그 형태로 제공 

          **③ 공통 모듈 설계 (HttpClientService)**
          - Jenkins API 호출 시 인증·헤더·오류 처리를 통합한 공통 모듈 설계
          - 사용 매뉴얼 문서화로 팀 전체 적응 지원
          - 코드 일관성·개발 효율 향상, 중복 코드 제거

